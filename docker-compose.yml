services:
  backend:
    build: ./backend
    container_name: clauses-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    environment:
      - DATABASE_URL=sqlite:///./clauses_detector.db
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - AUTH_MODE=${AUTH_MODE:-disabled}
      - BASIC_USERNAME=${BASIC_USERNAME:-}
      - BASIC_PASSWORD=${BASIC_PASSWORD:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:3000}
      - MAX_UPLOAD_SIZE_BYTES=${MAX_UPLOAD_SIZE_BYTES:-10485760}
    restart: unless-stopped
    networks:
      - clauses-network

  frontend:
    build: ./frontend
    container_name: clauses-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped
    networks:
      - clauses-network

networks:
  clauses-network:
    driver: bridge

volumes:
  db-data:
